name: Collect SNCF departures

on:
  schedule:
    # Every 15 minutes, 05:00–23:45 Europe/Paris (UTC+1/UTC+2)
    - cron: "5,20,35,50 4-22 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: collect-sncf
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect a snapshot
        env:
          SNCF_API_TOKEN: ${{ secrets.SNCF_API_TOKEN }}
          ROUENPARIS_DATA_DIR: data
          PYTHONPATH: backend
        run: python -m rouenparis collect --count 1

      - name: Generate reports
        env:
          SNCF_API_TOKEN: ${{ secrets.SNCF_API_TOKEN }}
          ROUENPARIS_DATA_DIR: data
          ROUENPARIS_SITE_DIR: site-build
          PYTHONPATH: backend
        run: python -m rouenparis report

      - name: Commit data
        run: |
          git config user.name "rouenparis-bot"
          git config user.email "rouenparis-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "data: collect SNCF snapshots [skip ci]"
            git push
          fi
